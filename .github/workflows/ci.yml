name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Admin data integration
        run: npm run test:admin-data
      - name: Install pinned Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Configure isolated browser test database
        run: |
          node - <<'NODE'
          const { randomBytes, scryptSync } = require('node:crypto');
          const fs = require('node:fs');
          const salt = randomBytes(16).toString('hex');
          const password = randomBytes(24).toString('hex');
          const secret = randomBytes(48).toString('hex');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `ADMIN_DATABASE_DRIVER=pglite\nADMIN_DB_PATH=${process.env.RUNNER_TEMP}/admin-e2e-pg\nADMIN_TEST_PASSWORD=${password}\nADMIN_PASSWORD_HASH=scrypt:${salt}:${scryptSync(password,salt,64).toString('hex')}\nADMIN_SESSION_SECRET=${secret}\n`);
          NODE
      - name: Migrate isolated browser database
        run: npm run admin:migrate
      - name: Browser regressions
        run: npm run test:e2e
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
