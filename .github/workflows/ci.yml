name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: admin_review
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate repository engineering skills
        run: node scripts/validate-engineering-skills.mjs
      - name: Offline iMac recovery preparation guards
        run: |
          python3 scripts/test-neon-macos-recovery.py
          node scripts/test-neon-recovery-sql.mjs
      - name: EC2 recovery synthetic acceptance
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          python3 scripts/test-ec2-recovery.py
          python3 scripts/test-ec2-stacks.py
          python3 scripts/test-ec2-control.py
          python3 scripts/test-ec2-protocol.py
          python3 scripts/test-neon-secret-launcher.py
          RECOVERY_TEST_CONTAINER="$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}')" python3 scripts/test-ec2-e2e.py
      - name: Neon adapter contract
        run: node scripts/test-neon-adapter.mjs
      - name: Migration tracking and recovery
        run: node scripts/test-migration-engine.mjs
      - name: Encrypted synthetic content restore
        run: node scripts/test-encrypted-content-restore.mjs
      - name: Disposable PostgreSQL compatibility and restore
        env:
          TEST_POSTGRES_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/admin_review
        run: |
          node scripts/test-postgres-integration.mjs
          node scripts/test-publication-runtime.mjs
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Publication snapshot migration regression
        run: node scripts/test-admin-publication.mjs
      - name: Publication runtime isolation and rollback
        run: node scripts/test-publication-runtime.mjs
      - name: Public project catalog privacy
        run: node scripts/test-public-projects.mjs
      - name: Project folders HTTP privacy
        run: node scripts/test-project-folders-http.mjs
      - name: SEO eligibility policy
        run: node scripts/test-seo.mjs
      - name: SEO HTTP and image integration
        run: node scripts/test-seo-http.mjs
      - name: Admin data integration
        run: npm run test:admin-data
      - name: Knowledge import and reconciliation
        run: npm run test:admin-knowledge
      - name: Admin security integration
        run: npm run test:admin-security
      - name: Install pinned Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Configure isolated browser test database
        run: |
          node - <<'NODE'
          const { randomBytes, scryptSync } = require('node:crypto');
          const fs = require('node:fs');
          const salt = randomBytes(16).toString('hex');
          const password = randomBytes(24).toString('hex');
          const secret = randomBytes(48).toString('hex');
          const hash = `scrypt:${salt}:${scryptSync(password,salt,64).toString('hex')}`;
          for (const value of [password, secret, hash]) console.log(`::add-mask::${value}`);
          fs.appendFileSync(process.env.GITHUB_ENV,
            `ADMIN_DATABASE_DRIVER=pglite\nPUBLIC_CONTENT_SOURCE=database\nPUBLIC_REDIRECTS_ENABLED=1\nADMIN_DB_PATH=${process.env.RUNNER_TEMP}/admin-e2e-pg\nADMIN_TEST_PASSWORD=${password}\nADMIN_TEST_EMAIL=admin@example.test\nADMIN_BOOTSTRAP_EMAIL=admin@example.test\nADMIN_PASSWORD_HASH=${hash}\nADMIN_SESSION_SECRET=${secret}\n`);
          NODE
      - name: Migrate isolated browser database
        run: npm run admin:migrate
      - name: Bootstrap isolated Admin account
        run: npm run admin:bootstrap
      - name: Import isolated public knowledge and enable matched review cutover
        run: |
          node scripts/admin-import-knowledge.mjs > "$RUNNER_TEMP/knowledge-report.json"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/knowledge-report.json"));if(!r.cutoverReady)process.exit(1);fs.appendFileSync(process.env.GITHUB_ENV,"PUBLIC_KNOWLEDGE_CUTOVER_SHA="+r.fingerprint+"\n")'
      - name: Browser regressions
        run: npm run test:e2e
      - name: Upload Admin review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-review-screenshots
          path: test-results/**/admin-*.png
          if-no-files-found: ignore
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
